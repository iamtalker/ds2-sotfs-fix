; DS2를 다크소울 3 방식으로 조작하게 해 주는 키 설정 파일입니다.
; 스페이스바 = 달리기/구르기. 대시 중에 스페이스바를 뗐다가 바로 다시 누르면 점프.
; Q         = 락온과 메뉴 뒤로가기를 동시에.
;
; [output_keys]는 DS2가 실제로 받는 키입니다. DS2에서 쓰지 않는 키를 고른 뒤,
; DS2 키 설정 화면에서 아래처럼 똑같이 지정하세요.
;   run = 달리기/구르기, jump = 점프, lockon = 락온, back = 메뉴 뒤로가기
; 이 기능이 켜져 있는 동안 DS2는 진짜 스페이스바와 Q를 받지 못합니다.
; 이 파일은 게임을 시작할 때 한 번만 읽습니다. 값을 바꾸면 게임을 껐다가 다시 실행하세요.

[output_keys]
run = 7
jump = 8
lockon = 9
back = 0

[input_keys]
; 실제로 누르는 키
run_jump = SPACE
lockon_back = Q

[timing_ms]
; 단위는 밀리초(1000 = 1초)입니다.
; 스페이스바를 이 시간 이상 누르고 있었어야 "대시"로 인정합니다. 이보다 짧으면 구르기입니다.
sprint_hold = 250
; 대시 중에 스페이스바를 떼면 달리기키를 이 시간 동안 계속 눌러 둡니다.
; 이 안에 스페이스바를 다시 누르면 점프입니다. 크면 점프가 쉬워지지만 대시를 멈출 때 더 달립니다.
rejump_window = 200
; 스페이스바를 다시 누른 뒤 점프키를 보내기까지의 지연
jump_delay = 40
; 점프키를 누르고 있는 시간
jump_press = 70
